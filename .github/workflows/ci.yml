name: Raidex CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --watch=false

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall .
      - run: pytest tests

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm audit stays advisory-only for now: the one current critical finding
      # (node-tar, via cacache -> @expo/cli, a build-tool-only transitive dep)
      # can only be fixed by a major Expo SDK bump, which needs its own manual
      # QA pass against real EAS/prebuild output - tracked as a follow-up, not
      # silently ignored.
      - run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
