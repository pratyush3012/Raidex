services:
  - type: web
    name: raidex-backend
    env: python
    region: singapore
    plan: free
    runtime: python
    pythonVersion: "3.12.0"
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false          # you paste this from Atlas after setup
      - key: DB_NAME
        value: raidex
      - key: ADMIN_PASSWORD
        sync: false          # required in production - server refuses to boot without it
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false          # paste from your Razorpay dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMS_PROVIDER
        value: msg91
      - key: MSG91_API_KEY
        sync: false          # paste from your MSG91 account (DLT sender/template registration required for India)
      - key: MSG91_SENDER_ID
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: PUSH_PROVIDER
        value: log
      - key: KYC_PROVIDER
        value: karza
      - key: KARZA_API_KEY
        sync: false          # paste from your Karza account (switch KYC_PROVIDER to idfy + set IDFY_* vars to use IDfy instead)
      - key: DAMAGE_AI_PROVIDER
        value: stub
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false          # paste from https://console.anthropic.com - Nexus falls back to a safe non-AI stub if unset
      - key: ALLOWED_ORIGINS
        sync: false          # set to your real frontend origin(s), comma-separated - never "*" in production
